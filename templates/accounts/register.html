{% extends 'base.html' %}
{% block content %}
<div class="card narrow">
  <h2>Create Account</h2>
  <p class="subtitle">Register to use VerifiCert.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn full">Create Account</button>
  </form>
  <p class="form-footer">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
