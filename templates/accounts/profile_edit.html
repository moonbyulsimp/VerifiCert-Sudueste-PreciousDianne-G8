{% extends 'base.html' %}
{% block content %}
<div class="card narrow">
  <h2>Edit Profile</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Save</button>
    <a href="{% url 'profile' %}" class="btn secondary">Cancel</a>
  </form>
</div>
{% endblock %}
