{% extends 'base.html' %}
{% block content %}
<div class="card narrow">
  <h2>Login</h2>
  <p class="subtitle">Sign in to your VerifiCert account.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn full">Login</button>
  </form>
  <p class="form-footer">No account yet? <a href="{% url 'register' %}">Register here</a></p>
</div>
{% endblock %}
